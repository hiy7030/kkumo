<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link th:replace="~{fragments/layout :: favicon}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 - KKUMO</title>
    <meta th:replace="~{fragments/layout :: viewTransitionMeta}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style th:replace="~{fragments/layout :: fadeInAnimation}"></style>
    <style th:replace="~{fragments/layout :: commonAlertModalStyle}"></style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center p-4">

    <!-- Common Alert Modal -->
    <div th:replace="~{fragments/layout :: commonAlertModal}"></div>

    <div class="page-content bg-white rounded-2xl shadow-sm p-8 max-w-md w-full border border-[#DBDFEA]">
        <!-- 왕관 로고 -->
        <div class="text-center mb-8">
            <div class="text-4xl mb-4">👑</div>
            <h1 class="text-3xl font-bold text-gray-800">비밀번호 찾기</h1>
            <p class="text-gray-600 mt-2">가입하신 이메일로 인증 후 비밀번호를 재설정하세요</p>
        </div>

        <!-- Step 1: 이메일 입력 -->
        <div id="step1" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
                    이메일
                </label>
                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    class="w-full px-4 py-3 rounded-xl border border-[#DBDFEA] focus:ring-2 focus:ring-[#ACB1D6] focus:border-[#8294C4] outline-none transition"
                />
            </div>
            <button
                id="sendCodeBtn"
                class="w-full bg-[#8294C4] hover:bg-[#6E80B0] text-white font-bold py-3 rounded-full transition-colors duration-200"
            >
                인증번호 받기
            </button>
        </div>

        <!-- Step 2: 인증번호 입력 (초기 숨김) -->
        <div id="step2" class="space-y-4 hidden">
            <div>
                <label for="code" class="block text-sm font-semibold text-gray-700 mb-2">
                    인증번호
                </label>
                <input
                    type="text"
                    id="code"
                    placeholder="6자리 인증번호"
                    maxlength="6"
                    class="w-full px-4 py-3 rounded-xl border border-[#DBDFEA] focus:ring-2 focus:ring-[#ACB1D6] focus:border-[#8294C4] outline-none transition"
                />
            </div>
            <button
                id="verifyCodeBtn"
                class="w-full bg-[#8294C4] hover:bg-[#6E80B0] text-white font-bold py-3 rounded-full transition-colors duration-200"
            >
                확인
            </button>
        </div>

        <!-- Step 3: 새 비밀번호 입력 (초기 숨김) -->
        <div id="step3" class="space-y-4 hidden">
            <div>
                <label for="newPassword" class="block text-sm font-semibold text-gray-700 mb-2">
                    새 비밀번호
                </label>
                <input
                    type="password"
                    id="newPassword"
                    placeholder="최소 8자 이상"
                    class="w-full px-4 py-3 rounded-xl border border-[#DBDFEA] focus:ring-2 focus:ring-[#ACB1D6] focus:border-[#8294C4] outline-none transition"
                />
            </div>
            <div>
                <label for="confirmPassword" class="block text-sm font-semibold text-gray-700 mb-2">
                    비밀번호 확인
                </label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="비밀번호를 다시 입력하세요"
                    class="w-full px-4 py-3 rounded-xl border border-[#DBDFEA] focus:ring-2 focus:ring-[#ACB1D6] focus:border-[#8294C4] outline-none transition"
                />
            </div>
            <button
                id="resetPasswordBtn"
                class="w-full bg-[#8294C4] hover:bg-[#6E80B0] text-white font-bold py-3 rounded-full transition-colors duration-200"
            >
                비밀번호 변경
            </button>
        </div>

        <!-- 로그인 페이지로 돌아가기 -->
        <div class="mt-6 text-center">
            <p class="text-gray-600 text-sm">
                <a href="/login" class="text-[#8294C4] hover:text-[#6E80B0] font-semibold hover:underline">
                    로그인 페이지로 돌아가기
                </a>
            </p>
        </div>
    </div>

    <script th:replace="~{fragments/layout :: commonAlertModalScript}"></script>

    <script>
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');

        const emailInput = document.getElementById('email');
        const codeInput = document.getElementById('code');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const verifyCodeBtn = document.getElementById('verifyCodeBtn');
        const resetPasswordBtn = document.getElementById('resetPasswordBtn');

        // Step 1: 인증번호 전송
        sendCodeBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();

            if (!email) {
                showModal('이메일을 입력해주세요.', '⚠️');
                return;
            }

            if (!email.includes('@')) {
                showModal('올바른 이메일 형식을 입력해주세요.', '⚠️');
                return;
            }

            try {
                sendCodeBtn.disabled = true;
                sendCodeBtn.textContent = '전송 중...';

                const response = await fetch('/kkumo/v1/mail/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                // 서버 에러 (500번대) 발생 시 에러 페이지로 리다이렉트
                if (response.status >= 500) {
                    window.location.href = '/error/errorPage';
                    return;
                }

                const result = await response.json();

                if (response.ok && result.success) {
                    showModal(result.data.message, '✅', () => {
                        step1.classList.add('hidden');
                        step2.classList.remove('hidden');
                    });
                } else {
                    showModal(result.message || '인증번호 전송에 실패했습니다.', '❌');
                }
            } catch (error) {
                // 네트워크 오류 등 예외 발생 시 에러 페이지로 리다이렉트
                window.location.href = '/error/errorPage';
            } finally {
                sendCodeBtn.disabled = false;
                sendCodeBtn.textContent = '인증번호 받기';
            }
        });

        // Step 2: 인증번호 확인
        verifyCodeBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const code = codeInput.value.trim();

            if (!code) {
                showModal('인증번호를 입력해주세요.', '⚠️');
                return;
            }

            if (code.length !== 6) {
                showModal('인증번호는 6자리여야 합니다.', '⚠️');
                return;
            }

            try {
                verifyCodeBtn.disabled = true;
                verifyCodeBtn.textContent = '확인 중...';

                const response = await fetch('/kkumo/v1/mail/validate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, code })
                });

                // 서버 에러 (500번대) 발생 시 에러 페이지로 리다이렉트
                if (response.status >= 500) {
                    window.location.href = '/error/errorPage';
                    return;
                }

                const result = await response.json();

                if (response.ok && result.success) {
                    showModal(result.data.message, '✅', () => {
                        step2.classList.add('hidden');
                        step3.classList.remove('hidden');
                    });
                } else {
                    showModal(result.message || '인증번호가 일치하지 않습니다.', '❌');
                }
            } catch (error) {
                // 네트워크 오류 등 예외 발생 시 에러 페이지로 리다이렉트
                window.location.href = '/error/errorPage';
            } finally {
                verifyCodeBtn.disabled = false;
                verifyCodeBtn.textContent = '확인';
            }
        });

        // Step 3: 비밀번호 변경
        resetPasswordBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const code = codeInput.value.trim();
            const newPassword = newPasswordInput.value.trim();
            const confirmPassword = confirmPasswordInput.value.trim();

            if (!newPassword) {
                showModal('새 비밀번호를 입력해주세요.', '⚠️');
                return;
            }

            if (newPassword.length < 8) {
                showModal('비밀번호는 최소 8자 이상이어야 합니다.', '⚠️');
                return;
            }

            if (newPassword !== confirmPassword) {
                showModal('비밀번호가 일치하지 않습니다.', '⚠️');
                return;
            }

            try {
                resetPasswordBtn.disabled = true;
                resetPasswordBtn.textContent = '변경 중...';

                const response = await fetch('/kkumo/v1/members/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, code, newPassword })
                });

                // 서버 에러 (500번대) 발생 시 에러 페이지로 리다이렉트
                if (response.status >= 500) {
                    window.location.href = '/error/errorPage';
                    return;
                }

                const result = await response.json();

                if (response.ok && result.success) {
                    showModal('비밀번호가 성공적으로 변경되었습니다.\n로그인 페이지로 이동합니다.', '🎉', () => {
                        window.location.href = '/login';
                    });
                } else {
                    showModal(result.message || '비밀번호 변경에 실패했습니다.', '❌');
                }
            } catch (error) {
                // 네트워크 오류 등 예외 발생 시 에러 페이지로 리다이렉트
                window.location.href = '/error/errorPage';
            } finally {
                resetPasswordBtn.disabled = false;
                resetPasswordBtn.textContent = '비밀번호 변경';
            }
        });
    </script>
</body>
</html>
