<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- ==================== Feed Item Fragment ==================== -->
<!--
    Parameters:
    - item: FeedResponse 객체
    - dateStyle: 'relative' (상대 시간, 예: "5분 전") 또는 'absolute' (절대 시간, 예: "2025년 12월 17일")
    - interactive: true (홈, 리액션 클릭 가능) 또는 false (마이페이지, 조회 전용)
-->
<div th:fragment="feedItem(item, dateStyle, interactive)" class="bg-white rounded-xl shadow-sm overflow-hidden border border-[#DBDFEA]">
    <div class="px-4 pt-4 pb-3 flex items-center justify-between">
        <div class="flex items-center space-x-2 relative">
            <div class="relative w-10 h-10 rounded-full bg-[#FDF4E3] border border-[#DBDFEA] flex items-center justify-center">

                <span class="text-2xl" th:text="${item.writerEmoji}">😊</span>

                <span th:if="${item.hasCrown}"
                      class="absolute -top-4 -left-2 text-xl transform rotate-[-25deg] drop-shadow-sm">👑</span>
            </div>
            <span class="font-bold text-gray-800" th:text="${item.nickname}">닉네임</span>
        </div>

        <!-- Date Display: Relative vs Absolute -->
        <span th:if="${dateStyle == 'relative'}"
              class="text-xs text-gray-500 relative-time"
              th:data-time="${item.createdAt}">방금 전</span>

        <span th:if="${dateStyle == 'absolute'}"
              class="text-xs text-gray-500"
              th:text="${#temporals.format(item.createdAt, 'yyyy년 MM월 dd일')}">2025년 12월 17일</span>
    </div>

    <div class="px-4">
        <div class="w-full aspect-square bg-gray-50 rounded-2xl border border-[#DBDFEA] overflow-hidden flex items-center justify-center relative">
            <!-- Clickable Image (public post or my-page) -->
            <img th:if="${!(item.isPrivate && interactive)}"
                    th:src="${item.thumbnailUrl}"
                    th:data-original-url="${item.originalImageUrl}"
                    onclick="openImageViewer(this.getAttribute('data-original-url'))"
                    alt="Feed Image"
                    class="w-full h-full object-contain cursor-pointer hover:opacity-90 transition"
            />

            <!-- Non-clickable Blurred Image (private post in home feed) -->
            <img th:if="${item.isPrivate && interactive}"
                    th:src="${item.thumbnailUrl}"
                    alt="Feed Image"
                    class="w-full h-full object-contain cursor-default blur-lg"
            />

            <!-- Private Post Overlay (only in home feed) -->
            <div th:if="${item.isPrivate && interactive}"
                 class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="text-center">
                    <span class="text-5xl mb-2 block">🔒</span>
                    <span class="text-white font-semibold text-sm bg-black/40 px-3 py-1 rounded-full">비밀글</span>
                </div>
            </div>
        </div>
    </div>

    <div class="p-4">
        <p class="text-sm text-gray-700 mb-3" th:text="${item.comment}">댓글</p>

        <!-- Reaction Pills Container -->
        <div class="border-t border-[#DBDFEA] pt-3">
            <div class="flex items-center gap-2 flex-wrap relative">

                <!-- Existing Reactions (count > 0만 표시) -->
                <th:block th:each="reactionType : ${T(com.kkumo.domain.reaction.ReactionType).values()}">
                    <th:block th:with="reactionInfo=${item.reactions.get(reactionType)}">
                        <th:block th:if="${reactionInfo != null && reactionInfo.count > 0}">

                            <!-- Interactive Mode: 클릭 가능한 버튼 with Tooltip -->
                            <button th:if="${interactive}"
                                    th:data-feed-id="${item.id}"
                                    th:data-reaction-type="${reactionType.name()}"
                                    th:data-reacted="${reactionInfo.isMeReacted}"
                                    th:classappend="${reactionInfo.isMeReacted ? 'bg-[#ACB1D6] text-white' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'}"
                                    onclick="handleReaction(this.getAttribute('data-feed-id'), this.getAttribute('data-reaction-type'), this)"
                                    class="reaction-pill relative flex items-center gap-1.5 rounded-full px-3 py-1 transition active:scale-95 group">
                                <span class="text-base" th:text="${reactionType.emoji}">❤️</span>
                                <span class="reaction-count text-xs font-semibold" th:text="${reactionInfo.count}">0</span>

                                <!-- Tooltip -->
                                <div th:if="${!reactionInfo.recentReactors.isEmpty()}"
                                     class="reaction-tooltip hidden group-hover:block absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 px-3 py-2 bg-gray-900 text-white text-xs rounded-lg whitespace-nowrap z-20 pointer-events-none">
                                    <span th:text="${#strings.listJoin(reactionInfo.recentReactors, '님, ') + '님'}">
                                        유저1님, 유저2님
                                    </span>
                                    <span th:if="${reactionInfo.count > reactionInfo.recentReactors.size()}"
                                          th:text="' 외 ' + ${reactionInfo.count - reactionInfo.recentReactors.size()} + '명'">
                                        외 N명
                                    </span>
                                    <!-- Tooltip Arrow -->
                                    <div class="absolute top-full left-1/2 transform -translate-x-1/2 -mt-1">
                                        <div class="w-2 h-2 bg-gray-900 rotate-45"></div>
                                    </div>
                                </div>
                            </button>

                            <!-- Read-only Mode: 조회 전용 with Tooltip -->
                            <div th:if="${!interactive}"
                                 class="reaction-pill relative flex items-center gap-1.5 rounded-full bg-gray-100 px-3 py-1 cursor-default group">
                                <span class="text-base" th:text="${reactionType.emoji}">❤️</span>
                                <span class="reaction-count text-xs font-semibold text-gray-700" th:text="${reactionInfo.count}">0</span>

                                <!-- Tooltip -->
                                <div th:if="${!reactionInfo.recentReactors.isEmpty()}"
                                     class="reaction-tooltip hidden group-hover:block absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 px-3 py-2 bg-gray-900 text-white text-xs rounded-lg whitespace-nowrap z-20 pointer-events-none">
                                    <span th:text="${#strings.listJoin(reactionInfo.recentReactors, '님, ') + '님'}">
                                        유저1님, 유저2님
                                    </span>
                                    <span th:if="${reactionInfo.count > reactionInfo.recentReactors.size()}"
                                          th:text="' 외 ' + ${reactionInfo.count - reactionInfo.recentReactors.size()} + '명'">
                                        외 N명
                                    </span>
                                    <!-- Tooltip Arrow -->
                                    <div class="absolute top-full left-1/2 transform -translate-x-1/2 -mt-1">
                                        <div class="w-2 h-2 bg-gray-900 rotate-45"></div>
                                    </div>
                                </div>
                            </div>

                        </th:block>
                    </th:block>
                </th:block>

                <!-- Add Reaction Button (Interactive Mode Only) -->
                <button th:if="${interactive}"
                        th:data-feed-id="${item.id}"
                        onclick="toggleReactionPopup(this.getAttribute('data-feed-id'))"
                        class="add-reaction-btn flex items-center justify-center w-8 h-8 rounded-full border-2 border-[#DBDFEA] hover:border-[#8294C4] hover:bg-gray-50 transition active:scale-95">
                    <span class="text-gray-600 text-lg leading-none">+</span>
                </button>

                <!-- Reaction Popup Menu (Interactive Mode Only) -->
                <div th:if="${interactive}"
                     th:id="'reaction-popup-' + ${item.id}"
                     class="reaction-popup hidden absolute bottom-full left-0 mb-2 bg-white rounded-xl shadow-lg border border-[#DBDFEA] p-2 z-10">
                    <div class="flex gap-1">
                        <button th:each="reactionType : ${T(com.kkumo.domain.reaction.ReactionType).values()}"
                                th:data-feed-id="${item.id}"
                                th:data-reaction-type="${reactionType.name()}"
                                onclick="handleReactionFromPopup(this.getAttribute('data-feed-id'), this.getAttribute('data-reaction-type'))"
                                class="flex items-center justify-center w-10 h-10 rounded-lg hover:bg-gray-100 transition active:scale-95"
                                th:title="${reactionType.name()}">
                            <span class="text-2xl" th:text="${reactionType.emoji}">❤️</span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- ==================== Reaction Script Fragment ==================== -->
<th:block th:fragment="reactionScript">
    <script>
        // ==================== Reaction Queue (Batch Processing) ====================
        const reactionQueue = [];

        // ==================== Reaction Popup Toggle ====================
        function toggleReactionPopup(feedId) {
            const popup = document.getElementById('reaction-popup-' + feedId);
            if (!popup) return;

            // 다른 팝업들 모두 닫기
            document.querySelectorAll('.reaction-popup').forEach(p => {
                if (p.id !== 'reaction-popup-' + feedId) {
                    p.classList.add('hidden');
                }
            });

            // 현재 팝업 토글
            popup.classList.toggle('hidden');
        }

        // ==================== Handle Reaction (기존 알약 클릭 - Toggle 방식) ====================
        function handleReaction(feedId, reactionType, element) {
            console.log('Reaction clicked:', feedId, reactionType);

            // 큐에 추가 (배치 처리용 - 백엔드에서 토글 처리)
            reactionQueue.push({
                postId: parseInt(feedId),
                reactionType: reactionType
            });

            // Optimistic Update: 즉시 UI 토글
            toggleReactionUI(feedId, reactionType, element);
        }

        // ==================== Handle Reaction from Popup (새 리액션 추가) ====================
        function handleReactionFromPopup(feedId, reactionType) {
            console.log('Reaction from popup:', feedId, reactionType);

            // 큐에 추가 (배치 처리용)
            reactionQueue.push({
                postId: parseInt(feedId),
                reactionType: reactionType
            });

            // Optimistic Update: 새 리액션 생성
            const selector = `button.reaction-pill[data-feed-id="${feedId}"][data-reaction-type="${reactionType}"]`;
            const existingPill = document.querySelector(selector);

            if (existingPill) {
                // 이미 존재하는 경우 토글
                toggleReactionUI(feedId, reactionType, existingPill);
            } else {
                // 새로 생성 (항상 활성화 상태로)
                createNewReactionPill(feedId, reactionType);
            }

            // 팝업 닫기
            toggleReactionPopup(feedId);
        }

        // ==================== Toggle Reaction UI (활성화/비활성화) ====================
        function toggleReactionUI(feedId, reactionType, element) {
            console.log('toggleReactionUI called:', feedId, reactionType);

            const countElement = element.querySelector('.reaction-count');
            if (!countElement) return;

            let currentCount = parseInt(countElement.textContent);
            const isReacted = element.getAttribute('data-reacted') === 'true';

            if (isReacted) {
                // Case A: 취소 동작 (비활성화)
                currentCount = Math.max(0, currentCount - 1);
                countElement.textContent = currentCount;
                element.setAttribute('data-reacted', 'false');

                // 스타일 제거 (회색으로 복귀)
                element.classList.remove('bg-[#ACB1D6]', 'text-white');
                element.classList.add('bg-gray-100', 'hover:bg-gray-200', 'text-gray-700');

                // 카운트가 0이 되면 알약 제거
                if (currentCount === 0) {
                    element.style.opacity = '0';
                    element.style.transform = 'scale(0.8)';
                    setTimeout(() => {
                        element.remove();
                    }, 300);
                }
            } else {
                // Case B: 추가 동작 (활성화)
                currentCount = currentCount + 1;
                countElement.textContent = currentCount;
                element.setAttribute('data-reacted', 'true');

                // 스타일 추가 (강조색 적용)
                element.classList.remove('bg-gray-100', 'hover:bg-gray-200', 'text-gray-700');
                element.classList.add('bg-[#ACB1D6]', 'text-white');

                // 시각적 피드백
                element.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    element.style.transform = 'scale(1)';
                }, 200);
            }
        }

        // ==================== Create New Reaction Pill Dynamically (항상 활성화 상태로) ====================
        function createNewReactionPill(feedId, reactionType) {
            console.log('Creating new reaction pill:', feedId, reactionType);

            // 리액션 이모지 매핑 (ReactionType Enum과 동기화)
            const reactionEmojis = {
                'LIKE': '👍',
                'FIRE': '🔥',
                'HEART': '❤️',
                'CLAP': '👏',
                'SAD': '😢',
                'LOL': '😆',
                'CHEERUP': '💪',
                'CHECK': '✅'
            };

            const emoji = reactionEmojis[reactionType] || '❓';

            // 해당 피드의 리액션 컨테이너 찾기
            const containers = document.querySelectorAll(`[data-feed-id="${feedId}"]`);
            let reactionContainer = null;

            // 리액션 알약들이 있는 컨테이너 찾기
            containers.forEach(container => {
                if (container.classList.contains('add-reaction-btn')) {
                    reactionContainer = container.parentElement;
                }
            });

            if (!reactionContainer) {
                console.error('Reaction container not found');
                location.reload();
                return;
            }

            // + 버튼 찾기
            const addButton = reactionContainer.querySelector('.add-reaction-btn');
            if (!addButton) {
                console.error('Add button not found');
                location.reload();
                return;
            }

            // 새 알약 생성 (활성화 상태로)
            const newPill = document.createElement('button');
            newPill.setAttribute('data-feed-id', feedId);
            newPill.setAttribute('data-reaction-type', reactionType);
            newPill.setAttribute('data-reacted', 'true');  // 활성화 상태
            newPill.onclick = function() {
                handleReaction(this.getAttribute('data-feed-id'), this.getAttribute('data-reaction-type'), this);
            };
            // 활성화 상태 스타일 적용
            newPill.className = 'reaction-pill relative flex items-center gap-1.5 rounded-full bg-[#ACB1D6] text-white px-3 py-1 transition active:scale-95 group';

            newPill.innerHTML = `
                <span class="text-base">${emoji}</span>
                <span class="reaction-count text-xs font-semibold">1</span>
            `;

            // + 버튼 바로 앞에 삽입
            reactionContainer.insertBefore(newPill, addButton);

            // 시각적 피드백 (등장 애니메이션)
            newPill.style.opacity = '0';
            newPill.style.transform = 'scale(0.8)';
            setTimeout(() => {
                newPill.style.transition = 'all 0.3s ease-out';
                newPill.style.opacity = '1';
                newPill.style.transform = 'scale(1)';
            }, 10);
        }

        // ==================== Batch Send Reactions on Page Unload ====================
        let isSending = false;  // 중복 전송 방지 플래그

        function sendReactionsBatch() {
            // 중복 호출 방지
            if (isSending) {
                console.log('⚠️ Already sending batch, skip duplicate call');
                return;
            }

            if (reactionQueue.length === 0) {
                console.log('No reactions to send');
                return;
            }

            isSending = true;  // 전송 시작

            // ==================== Queue Compression Logic ====================
            // 같은 postId + reactionType의 클릭 횟수를 카운트
            const reactionMap = new Map();

            reactionQueue.forEach(reaction => {
                // JSON 키 사용 (언더스코어 문제 해결)
                const key = JSON.stringify({ postId: reaction.postId, reactionType: reaction.reactionType });
                reactionMap.set(key, (reactionMap.get(key) || 0) + 1);
            });

            // 홀수 클릭만 필터링 (짝수 = 원래 상태로 복귀 = 전송 불필요)
            const finalReactions = [];
            reactionMap.forEach((count, key) => {
                if (count % 2 === 1) {  // 홀수 클릭만 전송
                    const { postId, reactionType } = JSON.parse(key);  // ✅ 안전한 파싱
                    finalReactions.push({
                        postId: postId,
                        reactionType: reactionType
                    });
                }
            });

            // 압축 후 전송할 데이터가 없으면 종료
            if (finalReactions.length === 0) {
                console.log('No final reactions to send after compression');
                reactionQueue.length = 0;
                isSending = false;
                return;
            }

            const payload = JSON.stringify({ reactions: finalReactions });
            console.log('==================== SENDING BATCH ====================');
            console.log('Original queue size:', reactionQueue.length);
            console.log('Compressed reactions to send:', finalReactions.length);
            finalReactions.forEach((r, i) => {
                console.log(`  [${i}] postId=${r.postId}, type=${r.reactionType}`);
            });
            console.log('Payload:', payload);
            console.log('======================================================');

            // 큐 즉시 비우기 (중복 전송 방지)
            reactionQueue.length = 0;

            // 동기 전송: navigator.sendBeacon (페이지 언로드 시 가장 안정적)
            const blob = new Blob([payload], { type: 'application/json' });
            const beaconSent = navigator.sendBeacon('/kkumo/v1/reactions/batch', blob);

            if (beaconSent) {
                console.log('✅ Beacon sent successfully');
            } else {
                console.error('❌ Beacon failed, trying fetch...');
                // Fallback: Fetch with keepalive
                fetch('/kkumo/v1/reactions/batch', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: payload,
                    keepalive: true
                }).catch(error => {
                    console.error('❌ Fetch also failed:', error);
                });
            }

            // 플래그 리셋 (비동기 환경에서도 안전하게)
            setTimeout(() => { isSending = false; }, 100);
        }

        // pagehide 이벤트: 페이지 이탈 시 배치 전송 (최신 브라우저)
        window.addEventListener('pagehide', function(event) {
            console.log('📤 Page hide event triggered');
            sendReactionsBatch();
        });

        // beforeunload 이벤트: pagehide를 지원하지 않는 구형 브라우저 대비
        window.addEventListener('beforeunload', function(event) {
            console.log('📤 Before unload event triggered');
            sendReactionsBatch();
        });

        // ==================== Close Popup on Outside Click ====================
        document.addEventListener('click', function(event) {
            // 클릭된 요소가 팝업이나 + 버튼이 아니면 모든 팝업 닫기
            if (!event.target.closest('.reaction-popup') && !event.target.closest('.add-reaction-btn')) {
                document.querySelectorAll('.reaction-popup').forEach(popup => {
                    popup.classList.add('hidden');
                });
            }
        });
    </script>
</th:block>

</body>
</html>
