<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <link th:fragment="favicon" rel="icon"
          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐢</text></svg>">

    <!-- ==================== View Transition Meta Fragment ==================== -->
    <meta th:fragment="viewTransitionMeta" name="view-transition" content="same-origin" />

    <!-- ==================== Fade In Animation Style Fragment ==================== -->
    <style th:fragment="fadeInAnimation">
        /* 메인 콘텐츠만 페이드 인 (header/navbar는 고정된 느낌) */
        main,
        .page-content {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<!-- ==================== Header Fragment ==================== -->
<header th:fragment="header(emoji)" class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-center items-center">
        <span class="text-4xl" th:text="${emoji}">👑</span>
    </div>
</header>

<!-- ==================== Bottom Navigation Fragment ==================== -->
<nav th:fragment="navbar(activePage, hasPostedToday)" class="fixed bottom-0 left-0 right-0 z-50 bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] border-t border-[#DBDFEA]">
    <div class="max-w-7xl mx-auto px-4 h-16 relative">
        <div class="grid grid-cols-5 h-full items-center">

            <a href="/kkumo/v1/home"
               th:classappend="${activePage == 'home'} ? 'text-[#8294C4]' : 'text-[#ACB1D6] hover:text-[#8294C4]'"
               class="flex flex-col items-center justify-center space-y-1 active:scale-95 transition">
                <span class="text-2xl">🏠</span>
                <span class="text-[10px] font-medium">홈</span>
            </a>

            <a href="/kkumo/v1/reports/my"
               th:classappend="${activePage == 'calendar'} ? 'text-[#8294C4]' : 'text-[#ACB1D6] hover:text-[#8294C4]'"
               class="flex flex-col items-center justify-center space-y-1 active:scale-95 transition">
                <span class="text-2xl">📅</span>
                <span class="text-[10px] font-medium">달성표</span>
            </a>

            <div class="relative"></div>

            <a href="/kkumo/v1/reports/all"
               th:classappend="${activePage == 'report'} ? 'text-[#8294C4]' : 'text-[#ACB1D6] hover:text-[#8294C4]'"
               class="flex flex-col items-center justify-center space-y-1 active:scale-95 transition">
                <span class="text-2xl">📊</span>
                <span class="text-[10px] font-medium">꾸포트</span>
            </a>

            <a href="/kkumo/v1/members/me"
               th:classappend="${activePage == 'mypage'} ? 'text-[#8294C4]' : 'text-[#ACB1D6] hover:text-[#8294C4]'"
               class="flex flex-col items-center justify-center space-y-1 active:scale-95 transition">
                <span class="text-2xl">😎</span>
                <span class="text-[10px] font-medium">꾸모</span>
            </a>
        </div>

        <button
                id="uploadBtn"
                class="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-[#8294C4] hover:bg-[#6E80B0] active:scale-95 text-white w-14 h-14 rounded-full shadow-lg border-4 border-white flex items-center justify-center transition z-50">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-8 h-8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
        </button>
    </div>
</nav>

<!-- ==================== Upload Button Script Fragment ==================== -->
<th:block th:fragment="uploadBtnScript(hasPostedToday)">
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const uploadBtn = document.getElementById('uploadBtn');
            const hasPostedToday = /*[[${hasPostedToday}]]*/ false;
            uploadBtn.addEventListener('click', function() {
                if (hasPostedToday) {
                    if (typeof openAlreadyPostedModal === 'function') {
                        openAlreadyPostedModal();
                    } else if (typeof showModal === 'function') {
                        showModal('오늘의 기록을 이미 완료했어요! 내일 또 만나요 😊');
                    }
                } else {
                    location.href = '/kkumo/v1/post/create';
                }
            });
        });
    </script>
</th:block>

<!-- ==================== Already Posted Modal Fragment ==================== -->
<div th:fragment="alreadyPostedModal" id="alreadyPostedModal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-[200] flex items-center justify-center">
    <div class="modal-content w-11/12 max-w-md bg-white rounded-2xl shadow-lg border border-[#DBDFEA] p-8 relative">
        <p class="text-slate-800 font-medium text-lg text-center mb-6">
            오늘의 기록을 이미 완료했어요!<br>
            내일 또 만나요 😊
        </p>

        <button
                onclick="closeAlreadyPostedModal()"
                id="modalConfirmBtn"
                class="w-full rounded-full bg-[#8294C4] text-white font-bold py-3 px-6 hover:bg-[#6E80B0] active:scale-95 transition duration-200 focus:outline-none focus:ring-2 focus:ring-[#ACB1D6] focus:ring-offset-2">
            확인
        </button>
    </div>
</div>

<!-- ==================== Already Posted Modal Style Fragment ==================== -->
<th:block th:fragment="alreadyPostedModalStyle">
    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-content {
            animation: fadeInUp 0.3s ease-out forwards;
        }
    </style>
</th:block>

<!-- ==================== Already Posted Modal Script Fragment ==================== -->
<th:block th:fragment="alreadyPostedModalScript">
    <script>
        function openAlreadyPostedModal() {
            const modal = document.getElementById('alreadyPostedModal');
            const btn = document.getElementById('modalConfirmBtn');
            modal.classList.remove('hidden');
            btn.focus();
        }

        function closeAlreadyPostedModal() {
            const modal = document.getElementById('alreadyPostedModal');
            modal.classList.add('hidden');
        }

        document.addEventListener('keydown', function(event) {
            const modal = document.getElementById('alreadyPostedModal');
            if (!modal.classList.contains('hidden')) {
                if (event.key === 'Enter' || event.key === 'Escape') {
                    closeAlreadyPostedModal();
                }
            }
        });
    </script>
</th:block>

<!-- ==================== Common Alert Modal Fragment ==================== -->
<div th:fragment="commonAlertModal" id="commonAlertModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[200] hidden items-center justify-center">
    <div class="modal-content fixed top-1/2 left-1/2 w-11/12 max-w-md bg-white rounded-2xl shadow-lg border border-[#DBDFEA] p-8" style="transform: translate(-50%, -50%);">
        <div id="commonAlertEmoji" class="text-5xl mb-4 text-center hidden"></div>
        <p id="commonAlertMessage" class="text-slate-800 font-medium text-lg text-center mb-6"></p>
        <button id="commonAlertConfirmBtn" class="w-full rounded-full bg-[#8294C4] text-white font-bold py-3 px-6 hover:bg-[#6E80B0] active:scale-95 transition duration-200 focus:outline-none focus:ring-2 focus:ring-[#ACB1D6] focus:ring-offset-2">
            확인
        </button>
    </div>
</div>

<!-- ==================== Common Alert Modal Style Fragment ==================== -->
<th:block th:fragment="commonAlertModalStyle">
    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translate(-50%, -45%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        .modal-content {
            animation: fadeInUp 0.3s ease-out;
        }

        #commonAlertModal.show {
            display: flex !important;
        }
    </style>
</th:block>

<!-- ==================== Common Alert Modal Script Fragment ==================== -->
<th:block th:fragment="commonAlertModalScript">
    <script>
        // Common Alert Modal Functions
        const commonAlertModal = document.getElementById('commonAlertModal');
        const commonAlertMessage = document.getElementById('commonAlertMessage');
        const commonAlertEmoji = document.getElementById('commonAlertEmoji');
        const commonAlertConfirmBtn = document.getElementById('commonAlertConfirmBtn');
        let modalCallback = null;

        function showModal(message, emojiOrCallback = null, callback = null) {
            // 파라미터 유연성: showModal(msg), showModal(msg, callback), showModal(msg, emoji, callback)
            let emoji = null;
            let finalCallback = null;

            if (typeof emojiOrCallback === 'function') {
                finalCallback = emojiOrCallback;
            } else if (typeof emojiOrCallback === 'string') {
                emoji = emojiOrCallback;
                finalCallback = callback;
            }

            commonAlertMessage.textContent = message;

            if (emoji) {
                commonAlertEmoji.textContent = emoji;
                commonAlertEmoji.classList.remove('hidden');
            } else {
                commonAlertEmoji.classList.add('hidden');
            }

            commonAlertModal.classList.add('show');
            commonAlertConfirmBtn.focus();
            modalCallback = finalCallback;
        }

        function hideModal() {
            commonAlertModal.classList.remove('show');
            commonAlertEmoji.classList.add('hidden');
            if (modalCallback) {
                modalCallback();
                modalCallback = null;
            }
        }

        commonAlertConfirmBtn.addEventListener('click', hideModal);

        // Enter key handler for modal
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && commonAlertModal.classList.contains('show')) {
                event.preventDefault();
                hideModal();
            }
        });
    </script>
</th:block>

</body>
</html>
