<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오류 - KKUMO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-sm p-8 max-w-md w-full text-center border border-[#DBDFEA]">
        <!-- 왕관 로고 -->
        <div class="text-4xl mb-2">👑</div>

        <!-- 이모지 -->
        <div class="text-5xl mb-4">😵</div>

        <!-- 제목 -->
        <h1 class="text-2xl font-bold text-gray-800 mb-2">
            앗! 오류가 발생했어요.
        </h1>

        <!-- 설명 -->
        <p class="text-gray-600 mb-6">
            잠시 후 다시 시도해주세요.
        </p>

        <!-- 디버깅 정보 (개발용) -->
        <div class="bg-[#DBDFEA] rounded-xl p-4 mb-6 text-left">
            <div class="text-xs text-gray-600 space-y-1">
                <div>
                    <span class="font-semibold">Error Code:</span>
                    <span th:text="${errorCode != null ? errorCode : 'UNKNOWN'}" class="ml-2 text-[#8294C4]">UNKNOWN</span>
                </div>
                <div>
                    <span class="font-semibold">Message:</span>
                    <span th:text="${errorMessage != null ? errorMessage : '알 수 없는 오류가 발생했습니다.'}" class="ml-2 text-[#8294C4]">알 수 없는 오류가 발생했습니다.</span>
                </div>
            </div>
        </div>

        <!-- 버튼: 로그인 상태에 따라 분기 -->
        <!-- Case 1: 로그인된 유저 -->
        <a sec:authorize="isAuthenticated()" href="/kkumo/v1/home"
           class="inline-block bg-[#8294C4] hover:bg-[#6E80B0] text-white font-bold px-6 py-3 rounded-full transition-colors duration-200">
            🏠 홈으로 돌아가기
        </a>

        <!-- Case 2: 비로그인 유저 -->
        <a sec:authorize="isAnonymous()" href="/login"
           class="inline-block bg-[#8294C4] hover:bg-[#6E80B0] text-white font-bold px-6 py-3 rounded-full transition-colors duration-200">
            🔑 로그인하러 가기
        </a>
    </div>
</body>
</html>
