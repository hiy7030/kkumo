<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link th:replace="~{fragments/layout :: favicon}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 기록 - KKUMO</title>
    <meta th:replace="~{fragments/layout :: viewTransitionMeta}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2/dist/browser-image-compression.js"></script>
    <style th:replace="~{fragments/layout :: fadeInAnimation}"></style>
    <style th:replace="~{fragments/layout :: commonAlertModalStyle}"></style>
</head>
<body class="bg-white min-h-screen">

<div th:replace="~{fragments/layout :: commonAlertModal}"></div>

<header class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b border-[#DBDFEA]">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
        <button
                onclick="location.href='/kkumo/v1/home'"
                class="text-gray-700 hover:bg-gray-200 p-2 rounded-full transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        <button
                id="submitBtn"
                type="button"
                class="bg-[#8294C4] text-white px-5 py-1.5 rounded-full font-semibold text-sm transition
                       hover:bg-[#6E80B0] cursor-pointer">
            기록하기
        </button>
    </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-4">
    <div class="flex space-x-3">
        <div class="flex-shrink-0">
            <div class="w-12 h-12 rounded-full bg-[#FDF4E3] shadow-sm flex items-center justify-center text-2xl border border-[#DBDFEA]">
                <span th:text="${emoji}">😊</span>
            </div>
        </div>

        <div class="flex-1 min-w-0">
            <textarea
                    id="contentInput"
                    placeholder="오늘의 기록은 어떠셨나요?"
                    maxlength="140"
                    class="w-full border-none bg-transparent resize-none outline-none text-gray-800 text-lg placeholder-[#ACB1D6]"
                    style="min-height: 120px;"
                    rows="4"></textarea>

            <div class="flex justify-end mb-3">
                <span id="charCount" class="text-xs text-gray-500">0 / 140</span>
            </div>

            <div id="imagePreviewContainer" class="hidden mb-4">
                <div class="relative inline-block">
                    <img id="imagePreview" src="" alt="Preview" class="rounded-xl max-w-full h-auto shadow-md" style="max-height: 400px;">
                    <button
                            id="removeImageBtn"
                            class="absolute top-2 right-2 bg-gray-900/70 text-white rounded-full p-1.5 hover:bg-gray-900 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-sm border-t border-[#DBDFEA] z-40">
    <div class="max-w-3xl mx-auto px-4 py-3">
        <div class="flex items-center space-x-4">
            <button
                    id="imageUploadBtn"
                    class="text-[#8294C4] hover:bg-[#8294C4]/10 p-2.5 rounded-full transition active:scale-95"
                    aria-label="사진 촬영 또는 업로드">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </button>

            <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    class="hidden">

            <div class="flex-1"></div>

            <div id="imageStatus" class="hidden">
                <span class="text-xs text-green-600 font-semibold">📷 사진 선택됨</span>
            </div>
        </div>
    </div>

    <div class="flex items-center justify-between px-4 py-3 border-t border-[#DBDFEA]">
        <label for="privateToggle" class="flex items-center space-x-3 cursor-pointer group">
            <input
                    type="checkbox"
                    id="privateToggle"
                    class="hidden peer">
            <div class="w-5 h-5 border-2 border-[#DBDFEA] rounded-md flex items-center justify-center peer-checked:bg-[#8294C4] peer-checked:border-[#8294C4] transition group-hover:border-[#8294C4]">
                <svg class="w-3 h-3 text-white hidden peer-checked:block" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                </svg>
            </div>
            <div class="flex flex-col">
                <span class="text-sm font-semibold text-gray-800">🔒 나만 보기</span>
                <span class="text-xs text-[#ACB1D6]">이 글은 홈에서 흐릿하게 보입니다</span>
            </div>
        </label>
    </div>
</div>

<script th:replace="~{fragments/layout :: commonAlertModalScript}"></script>

<script th:inline="javascript">
    // ==================== DOM Elements ====================
    const contentInput = document.getElementById('contentInput');
    const charCount = document.getElementById('charCount');
    const imageInput = document.getElementById('imageInput');
    const imageUploadBtn = document.getElementById('imageUploadBtn');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const removeImageBtn = document.getElementById('removeImageBtn');
    const imageStatus = document.getElementById('imageStatus');
    const submitBtn = document.getElementById('submitBtn');

    let selectedFile = null;

    // ==================== Auto Resize Textarea ====================
    contentInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = this.scrollHeight + 'px';

        const currentLength = this.value.length;
        charCount.textContent = currentLength + ' / 140';

        if (currentLength > 140) {
            charCount.classList.add('text-red-500');
            charCount.classList.remove('text-gray-500');
        } else {
            charCount.classList.add('text-gray-500');
            charCount.classList.remove('text-red-500');
        }
    });

    // ==================== Image Upload ====================
    imageUploadBtn.addEventListener('click', function() {
        imageInput.click();
    });

    imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
            showModal('이미지 파일만 선택할 수 있습니다.');
            return;
        }

        if (file.size > 30 * 1024 * 1024) {
            showModal('이미지 파일 크기는 30MB를 초과할 수 없습니다.');
            return;
        }

        selectedFile = file;

        // 이미지 미리보기
        const reader = new FileReader();
        reader.onload = function(event) {
            imagePreview.src = event.target.result;
            imagePreviewContainer.classList.remove('hidden');
            imageStatus.classList.remove('hidden');

            // ✅ 색상 변경 로직 삭제 (항상 파란색 유지)
        };
        reader.readAsDataURL(file);
    });

    // ==================== Remove Image ====================
    removeImageBtn.addEventListener('click', function() {
        selectedFile = null;
        imageInput.value = '';
        imagePreview.src = '';
        imagePreviewContainer.classList.add('hidden');
        imageStatus.classList.add('hidden');

        // ✅ 색상 변경 로직 삭제
    });

    // ==================== Submit Logic (필수 검증) ====================
    submitBtn.addEventListener('click', async function(e) {
        e.preventDefault(); // 기본 폼 제출 방지

        // 1. 이미지 필수 체크 (모달 띄우기)
        if (!selectedFile) {
            showModal('📸 사진 등록은 필수입니다!');
            return;
        }

        // 2. 버튼 비활성화 (중복 클릭 방지 & 로딩 표시)
        submitBtn.disabled = true;
        submitBtn.textContent = '이미지 압축 중...';
        submitBtn.classList.add('opacity-75', 'cursor-wait');

        try {
            // 이미지 압축
            const options = {
                maxSizeMB: 1,
                maxWidthOrHeight: 1920,
                useWebWorker: true
            };

            const compressedFile = await imageCompression(selectedFile, options);

            // 업로드 시작 UI 업데이트
            submitBtn.textContent = '업로드 중...';

            const formData = new FormData();
            formData.append('image', compressedFile);

            const content = contentInput.value.trim();
            if (content) {
                formData.append('content', content);
            }

            const isPrivate = document.getElementById('privateToggle').checked;
            formData.append('isPrivate', isPrivate.toString());

            const response = await fetch('/kkumo/v1/posts', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (result.success) {
                location.href = '/kkumo/v1/home';
            } else {
                showModal(result.message || '기록에 실패했습니다.');
                // 실패 시 복구
                submitBtn.disabled = false;
                submitBtn.textContent = '기록하기';
                submitBtn.classList.remove('opacity-75', 'cursor-wait');
            }
        } catch (error) {
            console.error('Error:', error);
            showModal('이미지 처리 중 오류가 발생했습니다. 다시 시도해주세요.');
            // 에러 시 복구
            submitBtn.disabled = false;
            submitBtn.textContent = '기록하기';
            submitBtn.classList.remove('opacity-75', 'cursor-wait');
        }
    });

    // ==================== Initial Focus ====================
    window.addEventListener('DOMContentLoaded', function() {
        contentInput.focus();
    });
</script>

</body>
</html>
