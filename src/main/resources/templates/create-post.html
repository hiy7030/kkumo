<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 기록 - KKUMO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FCF6D9] min-h-screen">

<!-- Top Bar -->
<header class="sticky top-0 z-50 bg-[#FCF6D9]/95 backdrop-blur-sm border-b border-gray-200">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
        <!-- Left: Close Button -->
        <button
                onclick="location.href='/kkumo/v1/home'"
                class="text-gray-700 hover:bg-gray-200 p-2 rounded-full transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        <!-- Right: Submit Button -->
        <button
                id="submitBtn"
                disabled
                class="bg-[#CF4B00] text-white px-5 py-1.5 rounded-full font-semibold text-sm transition
                       disabled:opacity-50 disabled:cursor-not-allowed
                       hover:bg-[#B03E00] disabled:hover:bg-[#CF4B00]">
            기록하기
        </button>
    </div>
</header>

<!-- Main Content -->
<main class="max-w-3xl mx-auto px-4 py-4">
    <div class="flex space-x-3">
        <!-- Left: Profile Emoji -->
        <div class="flex-shrink-0">
            <div class="w-12 h-12 rounded-full bg-white shadow-md flex items-center justify-center text-2xl">
                <span th:text="${emoji}">😊</span>
            </div>
        </div>

        <!-- Right: Input Area -->
        <div class="flex-1 min-w-0">
            <!-- Textarea -->
            <textarea
                    id="contentInput"
                    placeholder="오늘의 기록은 어떠셨나요?"
                    maxlength="140"
                    class="w-full border-none bg-transparent resize-none outline-none text-gray-800 text-lg placeholder-gray-400"
                    style="min-height: 120px;"
                    rows="4"></textarea>

            <!-- Character Count -->
            <div class="flex justify-end mb-3">
                <span id="charCount" class="text-xs text-gray-500">0 / 140</span>
            </div>

            <!-- Image Preview Area -->
            <div id="imagePreviewContainer" class="hidden mb-4">
                <div class="relative inline-block">
                    <img id="imagePreview" src="" alt="Preview" class="rounded-xl max-w-full h-auto shadow-md" style="max-height: 400px;">
                    <!-- Remove Image Button -->
                    <button
                            id="removeImageBtn"
                            class="absolute top-2 right-2 bg-gray-900/70 text-white rounded-full p-1.5 hover:bg-gray-900 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Bottom Toolbar (Fixed) -->
<div class="fixed bottom-0 left-0 right-0 bg-[#FCF6D9]/95 backdrop-blur-sm border-t border-gray-200 z-40">
    <div class="max-w-3xl mx-auto px-4 py-3">
        <div class="flex items-center space-x-4">
            <!-- Image Upload Button -->
            <button
                    id="imageUploadBtn"
                    class="text-[#CF4B00] hover:bg-[#CF4B00]/10 p-2 rounded-full transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
            </button>

            <!-- Hidden File Input -->
            <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    class="hidden">

            <!-- Spacer -->
            <div class="flex-1"></div>

            <!-- Image Status -->
            <div id="imageStatus" class="hidden">
                <span class="text-xs text-green-600 font-semibold">📷 사진 선택됨</span>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript -->
<script th:inline="javascript">
    // ==================== DOM Elements ====================
    const contentInput = document.getElementById('contentInput');
    const charCount = document.getElementById('charCount');
    const imageInput = document.getElementById('imageInput');
    const imageUploadBtn = document.getElementById('imageUploadBtn');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const removeImageBtn = document.getElementById('removeImageBtn');
    const imageStatus = document.getElementById('imageStatus');
    const submitBtn = document.getElementById('submitBtn');

    let selectedFile = null;

    // ==================== Auto Resize Textarea ====================
    contentInput.addEventListener('input', function() {
        // 자동 높이 조절
        this.style.height = 'auto';
        this.style.height = this.scrollHeight + 'px';

        // 글자 수 카운트
        const currentLength = this.value.length;
        charCount.textContent = currentLength + ' / 140';

        // 140자 초과 시 경고 색상
        if (currentLength > 140) {
            charCount.classList.add('text-red-500');
            charCount.classList.remove('text-gray-500');
        } else {
            charCount.classList.add('text-gray-500');
            charCount.classList.remove('text-red-500');
        }
    });

    // ==================== Image Upload ====================
    imageUploadBtn.addEventListener('click', function() {
        imageInput.click();
    });

    imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // 파일 타입 체크
        if (!file.type.startsWith('image/')) {
            alert('이미지 파일만 선택할 수 있습니다.');
            return;
        }

        // 파일 크기 체크 (10MB 제한)
        if (file.size > 10 * 1024 * 1024) {
            alert('이미지 파일 크기는 10MB를 초과할 수 없습니다.');
            return;
        }

        selectedFile = file;

        // 이미지 미리보기
        const reader = new FileReader();
        reader.onload = function(event) {
            imagePreview.src = event.target.result;
            imagePreviewContainer.classList.remove('hidden');
            imageStatus.classList.remove('hidden');

            // 제출 버튼 활성화
            submitBtn.disabled = false;
        };
        reader.readAsDataURL(file);
    });

    // ==================== Remove Image ====================
    removeImageBtn.addEventListener('click', function() {
        selectedFile = null;
        imageInput.value = '';
        imagePreview.src = '';
        imagePreviewContainer.classList.add('hidden');
        imageStatus.classList.add('hidden');

        // 제출 버튼 비활성화 (이미지 필수)
        submitBtn.disabled = true;
    });

    // ==================== Submit ====================
    submitBtn.addEventListener('click', async function() {
        // 이미지 필수 체크
        if (!selectedFile) {
            alert('사진은 필수입니다. 사진을 선택해주세요.');
            return;
        }

        // 버튼 비활성화 (중복 제출 방지)
        submitBtn.disabled = true;
        submitBtn.textContent = '기록 중...';

        // FormData 생성
        const formData = new FormData();
        formData.append('image', selectedFile);

        const content = contentInput.value.trim();
        if (content) {
            formData.append('content', content);
        }

        try {
            const response = await fetch('/kkumo/v1/posts', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (result.success) {
                // 성공 시 홈으로 이동
                location.href = '/kkumo/v1/home';
            } else {
                // 실패 시 (예: 1일 1회 제한)
                alert(result.message || '기록에 실패했습니다.');
                submitBtn.disabled = false;
                submitBtn.textContent = '기록하기';
            }
        } catch (error) {
            console.error('Error:', error);
            alert('기록 중 오류가 발생했습니다. 다시 시도해주세요.');
            submitBtn.disabled = false;
            submitBtn.textContent = '기록하기';
        }
    });

    // ==================== Initial Focus ====================
    // 페이지 로드 시 textarea에 자동 포커스
    window.addEventListener('DOMContentLoaded', function() {
        contentInput.focus();
    });
</script>

</body>
</html>
