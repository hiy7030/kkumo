<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - KKUMO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-lg p-8 max-w-md w-full">
        <!-- 왕관 로고 -->
        <div class="text-center mb-8">
            <div class="text-6xl mb-4">👑</div>
            <h1 class="text-3xl font-bold text-gray-800">KKUMO 가입</h1>
            <p class="text-gray-600 mt-2">나만의 기록 습관을 시작하세요</p>
        </div>

        <!-- 회원가입 폼 -->
        <form id="signupForm" class="space-y-4">
            <!-- 이메일 -->
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
                    이메일
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="example@email.com"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-yellow-300 focus:border-transparent outline-none transition"
                />
            </div>

            <!-- 비밀번호 -->
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                    비밀번호 (최소 8자)
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    minlength="8"
                    placeholder="비밀번호를 입력하세요"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-yellow-300 focus:border-transparent outline-none transition"
                />
            </div>

            <!-- 닉네임 -->
            <div>
                <label for="nickname" class="block text-sm font-semibold text-gray-700 mb-2">
                    닉네임 (2~20자)
                </label>
                <input
                    type="text"
                    id="nickname"
                    name="nickname"
                    required
                    minlength="2"
                    maxlength="20"
                    placeholder="닉네임을 입력하세요"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-yellow-300 focus:border-transparent outline-none transition"
                />
            </div>

            <!-- 이모지 선택 -->
            <script src="https://unpkg.com/@joeattardi/emoji-button@4.6.2/dist/index.min.js"></script>

            <div class="mb-6 relative"> <label class="block text-sm font-semibold text-gray-700 mb-2">
                나만의 이모지 선택 (👑 제외)
            </label>

                <div class="flex items-center gap-3">
                    <button type="button" id="emojiTriggerBtn"
                            class="w-full bg-white border-2 border-gray-200 text-gray-500 hover:border-yellow-300 hover:text-yellow-600 font-medium py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-sm text-lg">
                        <span id="btnIcon">😀</span>
                        <span id="emojiBtnText">이모지를 골라보세요</span>
                    </button>

                    <input type="hidden" id="myEmoji" name="myEmoji" required />
                </div>
                <p class="text-xs text-gray-400 mt-1 ml-1">* 왕관(👑)은 꾸모 공식 로고라 사용할 수 없어요.</p>
            </div>

            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    // 요소 찾기
                    const button = document.getElementById('emojiTriggerBtn');
                    const hiddenInput = document.getElementById('myEmoji');
                    const btnText = document.getElementById('emojiBtnText');
                    const btnIcon = document.getElementById('btnIcon');

                    // 라이브러리가 제대로 로드되었는지 확인
                    if (typeof EmojiButton === 'undefined') {
                        console.error("이모지 라이브러리가 로드되지 않았습니다! 네트워크 상태나 보안 설정을 확인하세요.");
                        alert("이모지 기능을 불러오지 못했습니다. 새로고침 해주세요.");
                        return;
                    }

                    // 이모지 픽커 설정
                    const picker = new EmojiButton({
                        position: 'bottom-start',
                        zIndex: 9999, // ✨ 핵심: 다른 요소보다 무조건 위에 뜨게 설정
                        rows: 6,
                        recentsCount: 10,
                        showPreview: false,
                        autoHide: false, // 클릭해도 안 닫히게 (테스트용) - 필요시 true로 변경
                        i18n: {
                            search: '이모지 검색...',
                            categories: {
                                recents: '최근 사용',
                                smileys: '감정',
                                people: '사람',
                                animals: '동물',
                                food: '음식',
                                activities: '활동',
                                travel: '여행',
                                objects: '사물',
                                symbols: '기호',
                                flags: '국기'
                            },
                            notFound: '검색 결과가 없어요 😢'
                        }
                    });

                    // 이모지 선택 이벤트
                    picker.on('emoji', selection => {
                        const selectedEmoji = selection.emoji;

                        // 🚫 왕관(👑) 금지
                        if (selectedEmoji === '👑') {
                            alert("앗! 왕관(👑)은 꾸모 관리자만 쓸 수 있어요.\n다른 이모지를 선택해주세요!");
                            return;
                        }

                        // UI 업데이트
                        hiddenInput.value = selectedEmoji;
                        btnIcon.innerText = selectedEmoji;
                        btnText.innerText = "이걸로 할래요!";
                        btnText.classList.add("text-gray-800", "font-bold");

                        button.classList.remove("border-gray-200", "text-gray-500");
                        button.classList.add("border-yellow-300", "bg-yellow-50", "text-gray-800");
                    });

                    // 버튼 클릭 이벤트
                    button.addEventListener('click', () => {
                        console.log("버튼 클릭됨! 픽커 여는 중..."); // 디버깅용 로그
                        picker.togglePicker(button);
                    });
                });
            </script>

            <!-- 가입 버튼 -->
            <button
                type="submit"
                class="w-full bg-yellow-300 hover:bg-yellow-400 text-gray-800 font-bold py-3 rounded-lg transition-colors duration-200"
            >
                가입하기
            </button>
        </form>

        <!-- 로그인 링크 -->
        <div class="mt-6 text-center">
            <p class="text-gray-600 text-sm">
                이미 회원이신가요?
                <a href="/login" class="text-blue-500 hover:text-blue-600 font-semibold">
                    로그인
                </a>
            </p>
        </div>
    </div>

    <script>
        let selectedEmoji = null;

        function selectEmoji(emoji) {
            selectedEmoji = emoji;
            document.getElementById('myEmoji').value = emoji;

            document.querySelectorAll('.emoji-btn').forEach(btn => {
                btn.classList.remove('border-yellow-300', 'bg-yellow-50');
            });

            event.target.classList.add('border-yellow-300', 'bg-yellow-50');
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!selectedEmoji) {
                alert('이모지를 선택해주세요!');
                return;
            }

            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                nickname: document.getElementById('nickname').value,
                myEmoji: selectedEmoji
            };

            try {
                const response = await fetch('/kkumo/v1/members', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    alert('환영합니다! 👑');
                    window.location.href = '/login';
                } else {
                    alert(result.error.message);
                }
            } catch (error) {
                alert('회원가입 중 오류가 발생했습니다. 다시 시도해주세요.');
                console.error('Signup error:', error);
            }
        });
    </script>
</body>
</html>
