<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - KKUMO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-2xl shadow-sm p-8 max-w-md w-full border border-[#DBDFEA]">
    <div class="text-center mb-8">
        <div class="text-4xl mb-4">👑</div>
        <h1 class="text-3xl font-bold text-gray-800">KKUMO 가입</h1>
        <p class="text-gray-600 mt-2">나만의 기록 습관을 시작하세요</p>
    </div>

    <form id="signupForm" class="space-y-4">
        <div>
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">이메일</label>
            <div class="flex gap-2">
                <input type="email" id="email" name="email" required placeholder="example@email.com" class="flex-1 px-4 py-3 rounded-xl border border-[#DBDFEA] focus:ring-2 focus:ring-[#ACB1D6] focus:border-[#8294C4] outline-none transition" />
                <button type="button" id="sendCodeBtn" class="bg-[#ACB1D6] hover:bg-[#9BA3C4] text-white font-semibold px-6 py-3 rounded-full transition-colors duration-200 whitespace-nowrap">
                    인증번호 전송
                </button>
            </div>
        </div>

        <!-- 인증번호 입력 영역 (초기에는 숨김) -->
        <div id="verificationSection" class="hidden">
            <label for="verificationCode" class="block text-sm font-semibold text-gray-700 mb-2">인증번호</label>
            <div class="flex gap-2">
                <input type="text" id="verificationCode" name="verificationCode" placeholder="6자리 인증번호" maxlength="6" class="flex-1 px-4 py-3 rounded-xl border border-[#DBDFEA] focus:ring-2 focus:ring-[#ACB1D6] focus:border-[#8294C4] outline-none transition" />
                <button type="button" id="verifyCodeBtn" class="bg-[#8294C4] hover:bg-[#6E80B0] text-white font-semibold px-6 py-3 rounded-full transition-colors duration-200 whitespace-nowrap">
                    확인
                </button>
            </div>
            <div class="flex justify-between items-center mt-2">
                <p id="verificationMessage" class="text-sm"></p>
                <p id="timer" class="text-sm font-semibold text-[#8294C4]"></p>
            </div>
        </div>

        <div>
            <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">비밀번호 (최소 8자)</label>
            <input type="password" id="password" name="password" required minlength="8" placeholder="비밀번호를 입력하세요" class="w-full px-4 py-3 rounded-xl border border-[#DBDFEA] focus:ring-2 focus:ring-[#ACB1D6] focus:border-[#8294C4] outline-none transition" />
        </div>

        <div>
            <label for="nickname" class="block text-sm font-semibold text-gray-700 mb-2">닉네임 (2~20자)</label>
            <input type="text" id="nickname" name="nickname" required minlength="2" maxlength="20" placeholder="닉네임을 입력하세요" class="w-full px-4 py-3 rounded-xl border border-[#DBDFEA] focus:ring-2 focus:ring-[#ACB1D6] focus:border-[#8294C4] outline-none transition" />
        </div>

        <div class="mb-6 relative">
            <label class="block text-sm font-semibold text-gray-700 mb-2">나만의 이모지 선택 (👑 제외)</label>
            <div class="flex items-center gap-3">
                <button type="button" id="emojiTriggerBtn" class="w-full bg-white border-2 border-[#DBDFEA] text-gray-500 hover:border-[#8294C4] hover:text-[#8294C4] font-medium py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-sm text-lg">
                    <span id="btnIcon">😀</span>
                    <span id="emojiBtnText">이모지를 골라보세요</span>
                </button>
                <input type="hidden" id="myEmoji" name="myEmoji" required />
            </div>
            <p class="text-xs text-[#ACB1D6] mt-1 ml-1">* 왕관(👑)은 꾸모 공식 로고라 사용할 수 없어요.</p>
        </div>

        <button type="submit" class="w-full bg-[#8294C4] hover:bg-[#6E80B0] text-white font-bold py-3 rounded-full transition-colors duration-200">
            가입하기
        </button>
    </form>

    <div class="mt-6 text-center">
        <p class="text-gray-600 text-sm">이미 회원이신가요? <a href="/login" class="text-[#8294C4] hover:text-[#6E80B0] font-semibold">로그인</a></p>
    </div>
</div>

<script type="module">
    import { EmojiButton } from 'https://unpkg.com/@joeattardi/emoji-button@4.6.4/dist/index.js';

    const triggerBtn = document.querySelector('#emojiTriggerBtn');
    const hiddenInput = document.querySelector('#myEmoji');
    const btnText = document.querySelector('#emojiBtnText');
    const btnIcon = document.querySelector('#btnIcon');

    const picker = new EmojiButton({
        position: 'bottom-start',
        zIndex: 9999,
        rows: 6,
        recentsCount: 10,
        showPreview: false,
        initialCategory: 'smileys',
        i18n: {
            search: '검색...',
            categories: {
                recents: '최근 사용',
                smileys: '감정',
                people: '사람',
                animals: '동물',
                food: '음식',
                activities: '활동',
                travel: '여행',
                objects: '사물',
                symbols: '기호',
                flags: '국기'
            },
            notFound: '결과 없음'
        }
    });

    picker.on('emoji', selection => {
        const selectedEmoji = selection.emoji;

        if (selectedEmoji === '👑') {
            alert("👑 왕관은 사용할 수 없습니다.");
            return;
        }

        btnIcon.innerText = selectedEmoji;
        btnText.innerText = "선택 완료!";
        triggerBtn.classList.add("border-[#8294C4]", "bg-[#FFEAD2]", "text-gray-900");
        triggerBtn.classList.remove("border-[#DBDFEA]", "text-gray-500");

        hiddenInput.value = selectedEmoji;
    });

    triggerBtn.addEventListener('click', () => {
        picker.togglePicker(triggerBtn);
    });

    // 이메일 인증 로직
    let isEmailVerified = false;
    let timerInterval = null;
    const emailInput = document.getElementById('email');
    const sendCodeBtn = document.getElementById('sendCodeBtn');
    const verificationSection = document.getElementById('verificationSection');
    const verificationCode = document.getElementById('verificationCode');
    const verifyCodeBtn = document.getElementById('verifyCodeBtn');
    const timerElement = document.getElementById('timer');
    const verificationMessage = document.getElementById('verificationMessage');

    // 인증번호 전송
    sendCodeBtn.addEventListener('click', async () => {
        const email = emailInput.value;
        if (!email) {
            alert('이메일을 입력해주세요.');
            return;
        }

        try {
            const response = await fetch('/kkumo/v1/mail/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const result = await response.json();

            if (result.success) {
                alert('✉️ 인증번호가 전송되었습니다. 이메일을 확인해주세요.');
                verificationSection.classList.remove('hidden');
                emailInput.disabled = true;
                sendCodeBtn.disabled = true;
                sendCodeBtn.classList.add('opacity-50', 'cursor-not-allowed');
                startTimer(180); // 3분 타이머
            } else {
                alert(result.error ? result.error.message : '전송 실패');
            }
        } catch (error) {
            alert('오류가 발생했습니다.');
            console.error(error);
        }
    });

    // 인증번호 확인
    verifyCodeBtn.addEventListener('click', async () => {
        const email = emailInput.value;
        const code = verificationCode.value;

        if (!code || code.length !== 6) {
            alert('6자리 인증번호를 입력해주세요.');
            return;
        }

        try {
            const response = await fetch('/kkumo/v1/mail/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, code })
            });
            const result = await response.json();

            if (result.success) {
                isEmailVerified = true;
                clearInterval(timerInterval);
                verificationMessage.textContent = '✅ 인증되었습니다';
                verificationMessage.classList.add('text-[#8294C4]', 'font-semibold');
                timerElement.textContent = '';
                verificationCode.disabled = true;
                verifyCodeBtn.disabled = true;
                verifyCodeBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                alert(result.error ? result.error.message : '인증 실패');
            }
        } catch (error) {
            alert('오류가 발생했습니다.');
            console.error(error);
        }
    });

    // 타이머 함수
    function startTimer(seconds) {
        let timeLeft = seconds;
        timerInterval = setInterval(() => {
            const minutes = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerElement.textContent = `${minutes}:${secs.toString().padStart(2, '0')}`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerElement.textContent = '시간 만료';
                verificationCode.disabled = true;
                verifyCodeBtn.disabled = true;
                verifyCodeBtn.classList.add('opacity-50', 'cursor-not-allowed');
                verificationMessage.textContent = '⚠️ 인증 시간이 만료되었습니다. 다시 요청해주세요.';
                verificationMessage.classList.add('text-gray-500');
            }
            timeLeft--;
        }, 1000);
    }

    // 폼 제출 로직
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        // 이메일 인증 확인
        if (!isEmailVerified) {
            alert('이메일 인증을 완료해주세요.');
            return;
        }

        const currentEmoji = hiddenInput.value;
        if (!currentEmoji) {
            alert('이모지를 선택해주세요!');
            return;
        }

        const formData = {
            email: emailInput.value,
            password: document.getElementById('password').value,
            nickname: document.getElementById('nickname').value,
            myEmoji: currentEmoji
        };

        try {
            const response = await fetch('/kkumo/v1/members', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });
            const result = await response.json();

            if (result.success) {
                alert('환영합니다! 👑');
                window.location.href = '/login';
            } else {
                alert(result.error ? result.error.message : '가입 실패');
            }
        } catch (error) {
            alert('오류가 발생했습니다.');
            console.error(error);
        }
    });
</script>
</body>
</html>
