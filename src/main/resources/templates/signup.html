<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - KKUMO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50 min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-3xl shadow-lg p-8 max-w-md w-full">
    <div class="text-center mb-8">
        <div class="text-6xl mb-4">👑</div>
        <h1 class="text-3xl font-bold text-gray-800">KKUMO 가입</h1>
        <p class="text-gray-600 mt-2">나만의 기록 습관을 시작하세요</p>
    </div>

    <form id="signupForm" class="space-y-4">
        <div>
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">이메일</label>
            <input type="email" id="email" name="email" required placeholder="example@email.com" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-yellow-300 focus:border-transparent outline-none transition" />
        </div>

        <div>
            <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">비밀번호 (최소 8자)</label>
            <input type="password" id="password" name="password" required minlength="8" placeholder="비밀번호를 입력하세요" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-yellow-300 focus:border-transparent outline-none transition" />
        </div>

        <div>
            <label for="nickname" class="block text-sm font-semibold text-gray-700 mb-2">닉네임 (2~20자)</label>
            <input type="text" id="nickname" name="nickname" required minlength="2" maxlength="20" placeholder="닉네임을 입력하세요" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-yellow-300 focus:border-transparent outline-none transition" />
        </div>

        <div class="mb-6 relative">
            <label class="block text-sm font-semibold text-gray-700 mb-2">나만의 이모지 선택 (👑 제외)</label>
            <div class="flex items-center gap-3">
                <button type="button" id="emojiTriggerBtn" class="w-full bg-white border-2 border-gray-200 text-gray-500 hover:border-yellow-300 hover:text-yellow-600 font-medium py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-sm text-lg">
                    <span id="btnIcon">😀</span>
                    <span id="emojiBtnText">이모지를 골라보세요</span>
                </button>
                <input type="hidden" id="myEmoji" name="myEmoji" required />
            </div>
            <p class="text-xs text-gray-400 mt-1 ml-1">* 왕관(👑)은 꾸모 공식 로고라 사용할 수 없어요.</p>
        </div>

        <button type="submit" class="w-full bg-yellow-300 hover:bg-yellow-400 text-gray-800 font-bold py-3 rounded-lg transition-colors duration-200">
            가입하기
        </button>
    </form>

    <div class="mt-6 text-center">
        <p class="text-gray-600 text-sm">이미 회원이신가요? <a href="/login" class="text-blue-500 hover:text-blue-600 font-semibold">로그인</a></p>
    </div>
</div>

<script type="module">
    import { EmojiButton } from 'https://unpkg.com/@joeattardi/emoji-button@4.6.4/dist/index.js';

    const triggerBtn = document.querySelector('#emojiTriggerBtn');
    const hiddenInput = document.querySelector('#myEmoji');
    const btnText = document.querySelector('#emojiBtnText');
    const btnIcon = document.querySelector('#btnIcon');

    const picker = new EmojiButton({
        position: 'bottom-start',
        zIndex: 9999,
        rows: 6,
        recentsCount: 10,
        showPreview: false,
        initialCategory: 'smileys',
        i18n: {
            search: '검색...',
            categories: {
                recents: '최근 사용',
                smileys: '감정',
                people: '사람',
                animals: '동물',
                food: '음식',
                activities: '활동',
                travel: '여행',
                objects: '사물',
                symbols: '기호',
                flags: '국기'
            },
            notFound: '결과 없음'
        }
    });

    picker.on('emoji', selection => {
        const selectedEmoji = selection.emoji;

        if (selectedEmoji === '👑') {
            alert("👑 왕관은 사용할 수 없습니다.");
            return;
        }

        btnIcon.innerText = selectedEmoji;
        btnText.innerText = "선택 완료!";
        triggerBtn.classList.add("border-yellow-300", "bg-yellow-50", "text-gray-900");
        triggerBtn.classList.remove("border-gray-200", "text-gray-500");

        hiddenInput.value = selectedEmoji;
    });

    triggerBtn.addEventListener('click', () => {
        picker.togglePicker(triggerBtn);
    });

    // 폼 제출 로직
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const currentEmoji = hiddenInput.value;

        if (!currentEmoji) {
            alert('이모지를 선택해주세요!');
            return;
        }

        const formData = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            nickname: document.getElementById('nickname').value,
            myEmoji: currentEmoji
        };

        try {
            const response = await fetch('/kkumo/v1/members', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });
            const result = await response.json();

            if (result.success) { // success 필드가 있는지 확인 필요 (없으면 응답 코드 체크)
                alert('환영합니다! 👑');
                window.location.href = '/login';
            } else {
                alert(result.error ? result.error.message : '가입 실패');
            }
        } catch (error) {
            alert('오류가 발생했습니다.');
            console.error(error);
        }
    });
</script>
</body>
</html>
