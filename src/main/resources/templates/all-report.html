<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link th:replace="~{fragments/layout :: favicon}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꾸포트 - KKUMO</title>
    <meta th:replace="~{fragments/layout :: viewTransitionMeta}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <th:block th:replace="~{fragments/layout :: alreadyPostedModalStyle}"></th:block>
    <style th:replace="~{fragments/layout :: fadeInAnimation}"></style>
</head>
<body class="bg-white min-h-screen pb-24">

<div th:replace="~{fragments/layout :: header(${hasCrown ? '👑' : '🐢'})}"></div>

<div class="bg-red-50 border-b border-red-100 text-center py-3 px-4 w-full">
    <p class="text-red-600 text-base md:text-lg font-bold">
        ⚠️ 꾸모 플랫폼 운영 종료 안내
    </p>
    <p class="text-red-500 text-sm md:text-base font-medium mt-1">
        26년 4월 12일부로 꾸모는 종료됩니다.<br>5개월 동안 꾸모를 함께해주셔서 감사했습니다.
    </p>
</div>

<main class="max-w-3xl mx-auto px-4 py-6">

    <!-- Month Navigation -->
    <section class="mb-8">
        <div class="flex items-center justify-center gap-6">
            <a th:if="${isPrevMonthAllowed}"
               th:href="@{/kkumo/v1/reports/all(year=${prevYear}, month=${prevMonth})}"
               class="text-3xl text-[#8294C4] hover:text-[#6E80B0] transition active:scale-95">
                ◀
            </a>
            <span th:if="${!isPrevMonthAllowed}" class="text-3xl text-gray-300 cursor-not-allowed">
                ◀
            </span>

            <h1 class="text-2xl font-bold text-slate-800">
                <span th:text="${year}">2024</span>년 <span th:text="${month}">12</span>월
            </h1>

            <a th:if="${!isCurrentMonth}"
               th:href="@{/kkumo/v1/reports/all(year=${nextYear}, month=${nextMonth})}"
               class="text-3xl text-[#8294C4] hover:text-[#6E80B0] transition active:scale-95">
                ▶
            </a>
            <span th:if="${isCurrentMonth}" class="text-3xl text-gray-300 cursor-not-allowed">
                ▶
            </span>
        </div>
    </section>

    <!-- Daily Summary Cards (Vertical List) -->
    <section class="space-y-6">
        <div th:each="summary : ${dailySummaries}" class="bg-white rounded-2xl shadow-sm border border-[#DBDFEA] p-5">

            <!-- Card Header -->
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-[#DBDFEA]">
                <!-- 날짜 및 요일 -->
                <div class="flex items-baseline gap-2">
                    <span th:text="${#temporals.format(summary.date, 'MM.dd')}" class="text-xl font-bold text-slate-800">12.18</span>
                    <span th:text="'(' + ${summary.dayOfWeek} + ')'" class="text-sm text-slate-500">(수)</span>
                </div>

                <!-- 참여 현황 -->
                <div class="flex items-center gap-1">
                    <span class="text-lg">🔥</span>
                    <span class="text-lg font-bold">
                        <span th:text="${summary.postedMembers.size()}" class="text-[#8294C4]">15</span>
                        <span class="text-slate-400">/</span>
                        <span th:text="${summary.totalMemberCount}" class="text-slate-600">20</span>
                    </span>
                </div>
            </div>

            <!-- Card Body: 기록한 멤버 (Success Group) -->
            <div th:if="${!summary.postedMembers.isEmpty()}" class="mb-4">
                <div class="grid grid-cols-5 gap-y-4 gap-x-2">
                    <div th:each="member : ${summary.postedMembers}"
                         class="flex flex-col items-center gap-1">
                        <span th:text="${member.emoji}" class="text-3xl">😀</span>

                        <span th:text="${member.nickname}"
                              class="text-xs text-slate-600 text-center w-full truncate px-1">닉네임</span>
                    </div>
                </div>
            </div>

            <!-- 기록한 멤버가 없을 때 -->
            <div th:if="${summary.postedMembers.isEmpty()}" class="mb-4 text-center py-6">
                <p class="text-slate-400 text-sm">아직 아무도 기록하지 않았어요 😢</p>
            </div>

            <!-- Card Footer: 미참여자 또는 완료 메시지 -->
            <div th:if="${!summary.notPostedMembers.isEmpty()}" class="pt-4 border-t border-[#DBDFEA]">
                <p class="text-xs text-slate-400 mb-3 font-medium">💤 미참여</p>

                <div class="grid grid-cols-5 gap-y-3 gap-x-2">
                    <div th:each="member : ${summary.notPostedMembers}"
                         class="flex flex-col items-center gap-0.5 opacity-50 grayscale-[30%]">
                        <span th:text="${member.emoji}" class="text-2xl">🐢</span>
                        <span th:text="${member.nickname}"
                              class="text-[10px] text-slate-500 text-center w-full truncate px-1">닉네임</span>
                    </div>
                </div>
            </div>

            <!-- 모두 참여 성공 메시지 -->
            <div th:if="${summary.notPostedMembers.isEmpty() && !summary.postedMembers.isEmpty()}"
                 class="pt-3 border-t border-[#DBDFEA] text-center">
                <p class="text-sm text-[#8294C4] font-medium">모두 참여 성공!</p>
            </div>

        </div>
    </section>

    <!-- Empty State (데이터가 없을 때) -->
    <div th:if="${dailySummaries.isEmpty()}" class="text-center py-12">
        <p class="text-slate-400 text-lg">이 달의 기록이 없습니다.</p>
    </div>

</main>

<div th:replace="~{fragments/layout :: navbar('report', ${hasPostedToday})}"></div>

<div th:replace="~{fragments/layout :: alreadyPostedModal}"></div>

<script th:inline="javascript">
    // Upload Button Click Handler
    document.addEventListener('DOMContentLoaded', function() {
        const uploadBtn = document.getElementById('uploadBtn');
        const hasPostedToday = /*[[${hasPostedToday}]]*/ false;
        uploadBtn.addEventListener('click', function() {
            if (hasPostedToday) {
                openAlreadyPostedModal();
            } else {
                location.href = '/kkumo/v1/post/create';
            }
        });
    });
</script>

<div th:replace="~{fragments/layout :: alreadyPostedModalScript}"></div>

</body>
</html>
