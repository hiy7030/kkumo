<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - KKUMO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-lg p-8 max-w-md w-full">
        <!-- 왕관 로고 -->
        <div class="text-center mb-8">
            <div class="text-6xl mb-4">👑</div>
            <h1 class="text-3xl font-bold text-gray-800">KKUMO</h1>
            <p class="text-gray-600 mt-2">매일매일 기록하는 습관</p>
        </div>

        <!-- 로그인 폼 -->
        <form th:action="@{/login}" method="post" class="space-y-4">
            <!-- 이메일 -->
            <div>
                <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">
                    이메일
                </label>
                <input
                    type="email"
                    id="username"
                    name="username"
                    required
                    placeholder="example@email.com"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-yellow-300 focus:border-transparent outline-none transition"
                />
            </div>

            <!-- 비밀번호 -->
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                    비밀번호
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="비밀번호를 입력하세요"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-yellow-300 focus:border-transparent outline-none transition"
                />
            </div>

            <!-- 로그인 버튼 -->
            <button
                type="submit"
                class="w-full bg-yellow-300 hover:bg-yellow-400 text-gray-800 font-bold py-3 rounded-lg transition-colors duration-200"
            >
                로그인
            </button>
        </form>

        <!-- 회원가입 링크 -->
        <div class="mt-6 text-center">
            <p class="text-gray-600 text-sm">
                아직 회원이 아니신가요?
                <a href="/kkumo/v1/signup" class="text-blue-500 hover:text-blue-600 font-semibold">
                    회원가입
                </a>
            </p>
        </div>

        <!-- 에러 메시지 -->
        <div th:if="${param.error}" class="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg">
            <p class="text-red-600 text-sm text-center">
                이메일 또는 비밀번호가 올바르지 않습니다.
            </p>
        </div>

        <!-- 로그아웃 메시지 -->
        <div th:if="${param.logout}" class="mt-4 p-3 bg-green-50 border border-green-200 rounded-lg">
            <p class="text-green-600 text-sm text-center">
                로그아웃되었습니다.
            </p>
        </div>
    </div>
</body>
</html>
