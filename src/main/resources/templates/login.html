<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link th:replace="~{fragments/layout :: favicon}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - KKUMO</title>
    <meta th:replace="~{fragments/layout :: viewTransitionMeta}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style th:replace="~{fragments/layout :: fadeInAnimation}"></style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center p-4">
    <div class="page-content bg-white rounded-2xl shadow-sm p-8 max-w-md w-full border border-[#DBDFEA]">
        <!-- 왕관 로고 -->
        <div class="text-center mb-8">
            <div class="text-4xl mb-4">👑</div>
            <h1 class="text-3xl font-bold text-gray-800">KKUMO</h1>
            <p class="text-gray-600 mt-2">꾸준히 하려는 모임</p>
        </div>

        <!-- 로그인 폼 -->
        <form th:action="@{/login}" method="post" class="space-y-4">
            <!-- 이메일 -->
            <div>
                <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">
                    이메일
                </label>
                <input
                    type="email"
                    id="username"
                    name="username"
                    required
                    placeholder="example@email.com"
                    class="w-full px-4 py-3 rounded-xl border border-[#DBDFEA] focus:ring-2 focus:ring-[#ACB1D6] focus:border-[#8294C4] outline-none transition"
                />
            </div>

            <!-- 비밀번호 -->
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                    비밀번호
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="비밀번호를 입력하세요"
                    class="w-full px-4 py-3 rounded-xl border border-[#DBDFEA] focus:ring-2 focus:ring-[#ACB1D6] focus:border-[#8294C4] outline-none transition"
                />
            </div>

            <!-- 로그인 유지하기 체크박스 -->
            <div class="flex items-center">
                <input
                    type="checkbox"
                    id="remember-me"
                    name="remember-me"
                    class="w-5 h-5 rounded border-[#DBDFEA] text-[#8294C4] focus:ring-2 focus:ring-[#ACB1D6] cursor-pointer"
                />
                <label for="remember-me" class="ml-2 text-sm text-gray-600 cursor-pointer select-none">
                    로그인 유지하기 (2주)
                </label>
            </div>

            <!-- 로그인 버튼 -->
            <button
                type="submit"
                class="w-full bg-[#8294C4] hover:bg-[#6E80B0] text-white font-bold py-3 rounded-full transition-colors duration-200"
            >
                로그인
            </button>
        </form>

        <!-- 회원가입 링크 -->
        <div class="mt-6 text-center space-y-2">
            <p class="text-gray-600 text-sm">
                아직 회원이 아니신가요?
                <a href="/kkumo/v1/signup" class="text-[#8294C4] hover:text-[#6E80B0] font-semibold">
                    회원가입
                </a>
            </p>
            <p class="text-gray-600 text-sm">
                비밀번호를 잊으셨나요?
                <a href="/kkumo/v1/forgot-password" class="text-[#8294C4] hover:text-[#6E80B0] font-semibold hover:underline">
                    비밀번호 찾기
                </a>
            </p>
        </div>

        <!-- 에러 메시지 -->
        <div th:if="${param.error}" class="mt-4 p-3 bg-red-50 border border-red-200 rounded-xl">
            <p class="text-red-600 text-sm text-center">
                이메일 또는 비밀번호가 올바르지 않습니다.
            </p>
        </div>

        <!-- 로그아웃 메시지 -->
        <div th:if="${param.logout}" class="mt-4 p-3 bg-green-50 border border-green-200 rounded-xl">
            <p class="text-green-600 text-sm text-center">
                로그아웃되었습니다.
            </p>
        </div>
    </div>
</body>
</html>
